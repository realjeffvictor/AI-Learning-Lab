# Render Blueprint for the API and its database. See docs/DEPLOYMENT.md.
# Check Render's current docs for supported Python versions and free-tier limits before deploying.
services:
  - type: web
    name: ai-learning-lab-api
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.lock
    startCommand: cd backend && alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-learning-lab-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

databases:
  - name: ai-learning-lab-db
    plan: free
